# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-wago-elrest"
BBFILE_PATTERN_meta-wago-elrest = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-wago-elrest = "6"

LAYERDEPENDS_meta-wago-elrest = "core"
LAYERSERIES_COMPAT_meta-wago-elrest = "scarthgap walnascar"
