#@TYPE: Machine
#@NAME: NXP i.MX 8M Plus WP400 with LPDDR4
#@SOC: i.MX8MP
#@DESCRIPTION: Machine configuration for NXP i.MX 8M Plus WP400 Panel with LPDDR4
#@MAINTAINER: Ralf Gliese <ralf.gliese@elrest.de>

require include/wp400.inc

# The device tree name is implicit for LPDDR4, so can't use MACHINE here
KERNEL_DEVICETREE_BASENAME = "imx8mp-evk"

KERNEL_DEVICETREE:append:use-nxp-bsp = " \
    freescale/imx8mp-wp400-0007.dtb \
    freescale/imx8mp-wp400-0010.dtb \
    freescale/imx8mp-wp400-0015.dtb \
"
#KBUILD_DEFCONFIG:wp400 = "imx8mp_wp400_defconfig"
#KBUILD_DEFCONFIG:wp400 = "imx_v8_defconfig"

UBOOT_CONFIG_BASENAME = "imx8mp_evk"
UBOOT_CONFIG[fspi] = "${UBOOT_CONFIG_BASENAME}_defconfig"
UBOOT_CONFIG[ndm]  = "${UBOOT_CONFIG_BASENAME}_ndm_defconfig"

# Set DDR FIRMWARE
DDR_FIRMWARE_VERSION = "202006"
DDR_FIRMWARE_NAME = " \
    lpddr4_pmu_train_1d_dmem_${DDR_FIRMWARE_VERSION}.bin \
    lpddr4_pmu_train_1d_imem_${DDR_FIRMWARE_VERSION}.bin \
    lpddr4_pmu_train_2d_dmem_${DDR_FIRMWARE_VERSION}.bin \
    lpddr4_pmu_train_2d_imem_${DDR_FIRMWARE_VERSION}.bin \
"

IMXBOOT_TARGETS_BASENAME = "flash_evk"

# Mainline BSP doesn't support LPDDR4 so it must be set to nxp.
# Also this machine isn't supported by u-boot-fslc but imx8mn-evk.inc already
# set the bootloader to u-boot-imx instead when NXP BSP is used.
##IMX_DEFAULT_BSP = "nxp"

# WAGO U-Boot
#PREFERRED_PROVIDER_virtual/bootloader = "u-boot-wago"
#PREFERRED_PROVIDER_u-boot = "u-boot-wago"
#PREFERRED_VERSION_u-boot-wago = "2023.07%"

